schemaVersion: 1
id: issued-asset-holder-transfer
version: 1
name: Issued asset holder-to-holder transfer
description: Issue TESTUSD to a sender, then transfer part of it to a second holder.
network: testnet
accounts:
  - id: issuer
    generate: true
    fund: true
  - id: sender
    generate: true
    fund: true
  - id: receiver
    generate: true
    fund: true
assets:
  - id: xlm
    type: native
  - id: test-usd
    type: issued
    code: TESTUSD
    issuer: issuer
steps:
  - id: sender-trusts-testusd
    type: changeTrust
    account: sender
    asset: test-usd
  - id: receiver-trusts-testusd
    type: changeTrust
    account: receiver
    asset: test-usd
  - id: issue-to-sender
    type: payment
    from: issuer
    to: sender
    asset: test-usd
    amount: "100"
  - id: sender-pays-receiver
    type: payment
    from: sender
    to: receiver
    asset: test-usd
    amount: "40"
assertions:
  - type: trustlineExists
    account: sender
    asset: test-usd
  - type: trustlineExists
    account: receiver
    asset: test-usd
  - type: transactionConfirmed
    step: issue-to-sender
  - type: transactionConfirmed
    step: sender-pays-receiver
  - type: balanceEquals
    account: sender
    asset: test-usd
    amount: "60"
  - type: balanceEquals
    account: receiver
    asset: test-usd
    amount: "40"
