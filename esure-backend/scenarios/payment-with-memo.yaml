schemaVersion: 1
id: payment-with-memo
version: 2
name: Payment with memo
description: Send XLM with a text memo and verify it on the confirmed Testnet transaction.
network: testnet
accounts:
  - id: sender
    generate: true
    fund: true
  - id: recipient
    generate: true
    fund: true
assets:
  - id: xlm
    type: native
steps:
  - id: send-xlm-with-memo
    type: payment
    from: sender
    to: recipient
    asset: xlm
    amount: "10"
    memo: "Esure memo tracking"
assertions:
  - type: transactionMemoEquals
    step: send-xlm-with-memo
    memo: "Esure memo tracking"
  - type: transactionConfirmed
    step: send-xlm-with-memo
  - type: balanceChangedBy
    account: recipient
    asset: xlm
    amount: "10"
  - type: stepSucceeded
    step: send-xlm-with-memo
